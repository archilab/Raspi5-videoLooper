# Video Looper Configuration File
# This file contains default settings for the video looper

# Default paths (will be replaced during installation)
VIDEOS_PATH="/home/USER_PLACEHOLDER/videos"
LOG_FILE="/var/log/video_looper.log"
INSTALL_DIR="/home/USER_PLACEHOLDER/video_looper"

# VLC settings
VLC_COMMAND="cvlc"
VLC_OPTIONS="--intf dummy --no-video-title-show --fullscreen --loop --no-audio --quiet --no-osd"

# Check interval (seconds)
CHECK_INTERVAL=30

# Supported video formats
VIDEO_EXTENSIONS=".mp4 .avi .mov .mkv .wmv .flv .webm .m4v"

# Service settings
SERVICE_NAME="video-looper"
SERVICE_USER="USER_PLACEHOLDER"
SERVICE_GROUP="USER_PLACEHOLDER"

# Logging settings
LOG_LEVEL="INFO"
LOG_FORMAT="%(asctime)s - %(levelname)s - %(message)s"
