# Video Looper Configuration File
# This file contains default settings for the video looper

# Default paths
VIDEOS_PATH="/home/looper/videos"
LOG_FILE="/var/log/video_looper.log"
INSTALL_DIR="/home/looper/video_looper"

# VLC settings
VLC_COMMAND="cvlc"
VLC_OPTIONS="--intf dummy --no-video-title-show --fullscreen --loop --no-audio --quiet --no-osd"

# Check interval (seconds)
CHECK_INTERVAL=30

# Supported video formats
VIDEO_EXTENSIONS=".mp4 .avi .mov .mkv .wmv .flv .webm .m4v"

# Service settings
SERVICE_NAME="video-looper"
SERVICE_USER="looper"
SERVICE_GROUP="looper"

# Logging settings
LOG_LEVEL="INFO"
LOG_FORMAT="%(asctime)s - %(levelname)s - %(message)s"
